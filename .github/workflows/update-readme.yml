name: Update years of experience

on:
  schedule:
    # 03:00 UTC on the 1st of each month
    - cron: '0 3 1 * *'
  workflow_dispatch: {}   # lets you trigger it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recalculate
        run: node scripts/update-experience.js

      - name: Commit if the number changed
        run: |
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update years of experience"
          git push
